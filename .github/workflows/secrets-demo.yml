name: Use secret safely
on:
  push:
    branches: [main]
  pull_request:
env:
  API_KEY: ${{ secrets.DEMO_API_KEY }}
jobs:
  secrets:
    steps:
      - name: testing the secret
        run: |
          echo "Key length: ${ #API_KEY }"
          curl -s -H "Authorization: Bearer $API_KEY" https://httpbin.org/bearer
