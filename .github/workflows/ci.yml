name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node}}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: echo "Testing Node ${{matrix.node}}"
    strategy:
      matrix:
        node: [18, 20, 22]
  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Run build after test jobs pass
        run: echo "building..."
  publish:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' &&  github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/mkharoub/devops-api:latest
            ghcr.io/mkharoub/devops-api:${{ github.sha }}
