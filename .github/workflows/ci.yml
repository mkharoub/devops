name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node}}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: echo "Testing Node ${{matrix.node}}"
    strategy:
      matrix:
        node: [18, 20, 22]
  build:
    needs: test
    steps:
      - name: Run build after test jobs pass
        run: echo "building..."
