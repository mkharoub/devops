name: Secrets leak attempts
on:
  push:
    branches: [main]
  pull_request:
env:
  API_KEY: ${{ secrets.DEMO_API_KEY }}
jobs:
  secretsLeakAttemps:
    runs-on: ubuntu-latest
    steps:
      - name: Run the Leak Attempts
        run: |
          echo "1. direct:   $API_KEY"
          echo "2. base64:   $(echo -n "$API_KEY" | base64)"
          echo "3. reversed: $(echo -n "$API_KEY" | rev)"
          echo "4. spaced:   $(echo -n "$api_key" | sed 's/./& /g')"

